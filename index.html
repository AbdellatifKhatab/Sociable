<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Sociable — Coming Soon">
  <title>Sociable — Coming Soon</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background: #000;
      color: #fff;
      font-family: Arial, Helvetica, sans-serif;
    }
    .background {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      z-index: 0;
      background: #000;
    }
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: rgba(0,0,0,.32);
    }
    .content {
      position: relative;
      z-index: 2;
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px 20px;
    }
    .logo {
      width: min(250px, 52vw);
      height: auto;
      margin-bottom: 28px;
      object-fit: contain;
      filter: drop-shadow(0 4px 16px rgba(0,0,0,.35));
    }
    .fallback-logo {
      display: none;
      font-size: clamp(42px, 9vw, 88px);
      font-weight: 700;
      letter-spacing: .04em;
      margin-bottom: 20px;
    }
    h1 {
      margin: 0;
      font-size: clamp(42px, 7vw, 82px);
      line-height: 1;
      font-weight: 700;
      letter-spacing: -.03em;
      text-shadow: 0 3px 18px rgba(0,0,0,.45);
    }
    p {
      margin: 18px 0 0;
      font-size: clamp(17px, 2.2vw, 24px);
      line-height: 1.5;
      text-shadow: 0 2px 12px rgba(0,0,0,.45);
    }
    <style>
.social {
  display: flex;
  gap: 14px;
  margin-top: 30px;
}

.social a {
  width: 48px;
  height: 48px;
  border: 1px solid rgba(255, 255, 255, 0.8);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  text-decoration: none;
  background: rgba(0, 0, 0, 0.12);
  transition: all 0.25s ease;
}

.social a:hover {
  transform: translateY(-3px);
  background: rgba(255, 255, 255, 0.18);
  border-color: #fff;
}

.social svg {
  width: 21px;
  height: 21px;
  fill: currentColor;
}

@media (max-width: 600px) {
  .social {
    margin-top: 24px;
  }
}
</style>
    }
  </style>
</head>
<body>
  <video class="background" autoplay muted loop playsinline preload="auto">
    <source src="bg-computer.mp4" type="video/mp4">
  </video>

  <div class="overlay"></div>

  <main class="content">
    <img class="logo" src="images/logo.png" alt="Sociable"
         onerror="this.style.display='none'; document.querySelector('.fallback-logo').style.display='block';">
    <div class="fallback-logo">Sociable</div>

    <h1>Coming Soon</h1>
    <p>Something amazing is coming soon.</p>

    <div class="social" aria-label="Social media">

  <!-- Instagram -->
  <a
    href="https://www.instagram.com/sociable.sa/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Instagram">

    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9z"/>
      <path d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10zm0 2a3 3 0 1 1 0 6 3 3 0 0 1 0-6z"/>
      <circle cx="17.5" cy="6.5" r="1.25"/>
    </svg>

  </a>

  <!-- TikTok -->
  <a
    href="https://www.tiktok.com/@sociable.sa"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="TikTok">

    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M16.5 2h3c.2 2.2 1.3 3.8 3.5 4.7v3.1c-1.3-.1-2.6-.5-3.7-1.2v6.7c0 5-3.1 7.7-7.3 7.7-3.8 0-6.5-2.7-6.5-6.3 0-3.8 3-6.6 6.9-6.6.4 0 .8 0 1.2.1v3.2c-.4-.1-.8-.2-1.2-.2-1.8 0-3.5 1.2-3.5 3.4 0 1.8 1.3 3.3 3.2 3.3 2 0 3.4-1.3 3.4-3.7V2z"/>
    </svg>

  </a>

</div>
  </main>
</body>
</html>
